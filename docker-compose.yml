version: '3.8'

services:
  # 1. Local LLM Engine (Nvidia GPU Acceleration)
  ollama:
    image: ollama/ollama:latest
    container_name: local_llm_engine
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull qwen2.5-coder:7b && tail -f /dev/null"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 2. Custom AI Control Panel
  ai_control_panel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_control_panel
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - OLLAMA_URL=http://ollama:11434/api/chat
      - MODEL_NAME=qwen2.5-coder:7b
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - app_data:/app
      # --- USER DIRECTORIES (PORTABLE NAMED VOLUMES) ---
      - user_desktop:/user_data/Desktop
      - user_downloads:/user_data/Downloads
      - user_documents:/user_data/Documents
      - user_pictures:/user_data/Pictures
      - user_videos:/user_data/Videos
      - user_music:/user_data/Music
    depends_on:
      - ollama

# Persistent volume definitions managed automatically by Docker
volumes:
  ollama_data:
  app_data:
  user_desktop:
  user_downloads:
  user_documents:
  user_pictures:
  user_videos:
  user_music: