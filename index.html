<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local AI Control Panel</title>
    <style>
        body { font-family: Segoe UI, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; gap: 20px; }
        #sidebar { width: 280px; background: #1e1e1e; padding: 15px; border-radius: 8px; }
        #main { flex-grow: 1; display: flex; flex-direction: column; height: 90vh; }
        #chatbox { flex-grow: 1; background: #1e1e1e; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 10px; font-family: monospace; }
        .msg { margin-bottom: 12px; }
        .user { color: #4da6ff; font-weight: bold; }
        .bot { color: #5cdb95; }
        .system { color: #ffbd2e; italic; }
        textarea { width: 100%; height: 60px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 5px; padding: 8px; }
        button { background: #0078d4; color: white; border: none; padding: 10px 15px; margin-top: 5px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background: #005a9e; }
        button:disabled { background: #444; cursor: not-allowed; }
        .btn-action { background: #3a3a3a; margin-bottom: 8px; text-align: left; }
        .btn-action:hover { background: #4a4a4a; }
        pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body>

<div id="sidebar">
    <h3>Quick Actions</h3>
    <button class="btn-action" onclick="triggerAction('Check system memory usage and top CPU processes using PowerShell')">📊 Check System Resources</button>
    <button class="btn-action" onclick="triggerAction('List all running Docker containers without stopping any')">🐳 List Running Containers</button>
    <button class="btn-action" onclick="triggerAction('Draft a PowerShell script to clean up temporary files safely in C:\\AI_Playground')">🧹 Draft Temp Cleanup Script</button>
</div>

<div id="main">
    <div id="chatbox"></div>
    <textarea id="promptInput" placeholder="Ask your agent or type a system command request..."></textarea>
    <button id="sendBtn" onclick="sendMessage()">Send Request</button>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById('promptInput');
        const sendBtn = document.getElementById('sendBtn');
        const text = input.value.trim();
        if (!text) return;

        appendMsg('User', text);
        input.value = '';
        input.disabled = true;
        sendBtn.disabled = true;

        const loadingId = appendMsg('Agent', 'Processing request...');

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({prompt: text})
            });

            if (!res.ok) {
                throw new Error(`HTTP error! status: ${res.status}`);
            }

            const data = await res.json();
            updateMsg(loadingId, 'Agent', data.response || 'No response from model.');
        } catch (err) {
            updateMsg(loadingId, 'Agent', `Error: ${err.message}`);
        } finally {
            input.disabled = false;
            sendBtn.disabled = false;
            input.focus();
        }
    }

    function triggerAction(promptText) {
        document.getElementById('promptInput').value = promptText;
        sendMessage();
    }

    function appendMsg(sender, text) {
        const box = document.getElementById('chatbox');
        const div = document.createElement('div');
        const msgId = 'msg-' + Date.now();
        div.id = msgId;
        div.className = 'msg';
        div.innerHTML = `<span class="${sender.toLowerCase()}">${sender}:</span> <pre>${escapeHtml(text)}</pre>`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return msgId;
    }

    function updateMsg(msgId, sender, text) {
        const div = document.getElementById(msgId);
        if (div) {
            div.innerHTML = `<span class="${sender.toLowerCase()}">${sender}:</span> <pre>${escapeHtml(text)}</pre>`;
        }
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
